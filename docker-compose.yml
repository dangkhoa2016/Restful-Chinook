version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_PATH=db/
      - DB_NAME=nodejs_chinook_development.sqlite3
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
